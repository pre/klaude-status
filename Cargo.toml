[package]
name = "klaude-status"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "A fast, dependency-light status line for Claude Code: context fill, rate limits, git state and cost on two lines."
repository = "https://github.com/matti/klaude-status"
license = "MIT"
readme = "README.md"
keywords = ["claude", "claude-code", "statusline", "cli", "git"]
categories = ["command-line-utilities", "development-tools"]
exclude = ["/.github"]

[dependencies]
gix = "0.86.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
terminal_size = "0.4.4"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
